<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-paper-Scissor</title>
</head>
<body>
    <h1>Rock paper Scissor</h1>
    <button onclick="
         printResult('Rock');
    ">Rock</button>
    <button  onclick="
        printResult('Paper');
    ">Paper</button>
    <button onclick="
        printResult('Scissors');
    ">Scissors</button>

    <button onclick="
       
        score.wins = 0;
        score.losses = 0;
        score.ties = 0 ;
        console.log(`Score reseted `);
        localStorage.removeItem('score');
        
    "> Reset Score</button>

    <script>

        let score = JSON.parse(localStorage.getItem('score'));
        // other method
        // // let score = JSON.parse(localStorage.getItem('score')) ||{
//         wins : 0,
//         losses : 0,
//         ties : 0 
//     };

        if(score === null){
            score = {
                wins : 0,
                losses : 0,
                ties : 0 
            }
        }

        //  other method
        // if(!score){
        //     score = {
        //         wins : 0,
        //         losses : 0,
        //         ties : 0 
        //     }
        // }
       

        function pickCompterMove(){

            let computerMove = '';

            const randomNumber = Math.random();

            if(randomNumber >=0 && randomNumber < 1/3){
                computerMove ='Rock';  
            }else if(randomNumber >= 1/3 && randomNumber < 2/3){
                computerMove ='Paper';
                
            }else if(randomNumber >= 2/3 && randomNumber < 1){
                computerMove ='Scissors';  
            }
            return(computerMove);

        }

        function printResult(playerMove){
            const computerMove = pickCompterMove();

            let result = '';
            if(playerMove === 'Scissors'){
                 if(computerMove === 'Rock'){
                    result  = 'You lose';
                    
                }else if(computerMove === 'Paper'){
                    result = ' You Win';
                }else if(computerMove === 'Scissors'){
                    result = 'Tie';
                } 

            }else if(playerMove === 'Paper'){
                if(computerMove === 'Rock'){
                    result  = 'You Win';
                }else if(computerMove === 'Paper'){
                    result = 'Tie';
                }else if(computerMove === 'Scissors'){
                    result = 'You lose';
                }

            }else if(playerMove==='Rock'){
                if(computerMove === 'Rock'){
                    result  = 'Tie';
                }else if(computerMove === 'Paper'){
                    result = 'You lose';
                }else if(computerMove === 'Scissors'){
                    result = 'You Win';
                }
            }


            if(result === 'You Win'){
                score.wins += 1 ;
            }else if(result === 'You lose'){
                score.losses +=1;
            }else if(result === 'Tie'){
                score.ties +=1;
            }

            localStorage.setItem('score',JSON.stringify(score));

            
            alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}.\n Wins : ${score.wins} , Losses : ${score.losses}, Ties : ${score.ties}`);
        }
    </script>
</body>
</html>
